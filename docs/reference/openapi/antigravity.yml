# OpenAPI 3.1 reference for the Google Antigravity (Cloud Code) v1internal surface,
# reverse engineered from Google Antigravity CLI (`agy`) 1.5.3
# (/home/ming/.local/bin/agy, stripped Go ELF, 246,837,648 bytes)
# and live-verified against a real consumer (Google One) account.
#
# 2026-11-07 revision (agy 1.5.2 -> 1.5.3): live capture of a full inference
# turn under an intercepting HTTPS proxy (mitmproxy) plus TLS ClientHello and
# HTTP/2 frame capture on the raw socket. What this revision adds:
#   - identity: UA cl counter is now 1016078699 (was 999748552); release stamp
#     1.5.3-6604829099950080; toolchain go1.28-20261102-RC00 cl/1012564305
#     +298f53e483 X:fieldtrack,boringcrypto,simd,nogolistexportnewformat.
#   - transport: every Cloud Code call is HTTP/2 (`h2` ALPN); the 1.3.x capture
#     was HTTP/1.1 over a browser-shaped stack. The wire fingerprint (TLS
#     ClientHello + h2 SETTINGS/WINDOW_UPDATE + pseudo-header order) is recorded
#     under `x-network-fingerprint`; the matching implementation is netune's
#     `Preset::AntigravityCli` + `H2Fingerprint::go`.
#   - a third OAuth client pair exists in 1.5.3 (business/BAIC lane); its role is
#     inferential (`SetBusinessOAuthClientIDOverride`) and is marked as such.
#   - risk control: this account was served `403 TOS_VIOLATION` at the inference
#     verb while every account/catalog verb stayed 200. The exact rejection shape
#     and the out-of-band telemetry channel are recorded under `x-risk-control`.
#
# 2026-10-23 revision: re-verified against the installed `agy` 1.3.6→1.4.0
# lineage and a paid-pro consumer account (tier G1_PRO): the inference
# `model` field routes by *registered PredictionService entities* —
# `gemini-4-argon` (bare) is NOT a registered entity (404
# `Requested entity was not found`); only its per-level variants
# `gemini-4-argon-{low,medium,high}` resolve (200). The catalog exposes
# per-level `tieredModelIds` entries for gemini-3.8/3.5 (canonical
# `-tiered` entity takes `thinkingLevel` in-band) but exposes argon
# solely as per-level ids + `defaultAgentModelId`, so argon's wire effort
# surface is the entity suffix itself.
#
# Consumers: the implementer maintaining the `antigravity` channel in
# Nuo (providers/nuo-provider-google-antigravity crate). This file never encodes code
# decisions — it states the contract exactly as the endpoint enforces it.
#
# Method note: `agy` was run under an intercepting HTTPS proxy with a locally
# trusted CA, capturing every Cloud Code request/response of a real inference
# turn; identity fields were then rewritten per-request (differential probing)
# to establish which header values the backend discriminates on. Provenance for
# each fact is stamped `x-provenance: live` (observed on the wire) or
# `x-provenance: bundle` (extracted from the binary image).
#
# Vendor extensions used (x-…):
#   x-provenance          live | bundle (how the fact was established)
#   x-admission-band      backend-admitted client identity values (live differential probe)
openapi: 3.1.0
info:
  title: Google Antigravity (Cloud Code) Internal API
  version: 1.5.3
  summary: >-
    The Cloud Code companion surface behind the `agy` CLI: an OAuth2 (Google
    Cloud Platform scope set) authenticated envelope that wraps Google-native
    `GenerateContent` semantics inside a `v1internal` request shell keyed by a
    zero-config companion project (`aicode-consumers`).
  description: |
    Base URLs (bundle + live):

    | Environment | Base URL | Note |
    | --- | --- | --- |
    | Production (daily) | `https://daily-cloudcode-pa.googleapis.com` | what the shipped CLI uses |
    | Production (stable) | `https://cloudcode-pa.googleapis.com` | same backend family; appears in the bundle and in `CLOUD_CODE_URL` docs |
    | Preprod | `https://preprod-daily-cloudcode-pa.sandbox.googleapis.com` | bundle-only staging host |

    The Cloud Code URL is overridable at runtime: `CLOUD_CODE_URL` env var
    (`Overriding CloudCodeServerURL via CLOUD_CODE_URL environment variable`),
    and the client may also rewrite it dynamically (`Dynamically updating
    CloudCodeServerURL`). A user-supplied project switches the surface to
    Vertex-AI semantics on `aiplatform.googleapis.com` (`rawPredict`,
    `{$api_version}/models/{model}:generateContent`), outside the envelope
    documented here.

    Envelope semantics (the defining fact of this surface): every endpoint is a
    `POST` to `/{host}/v1internal:{verb}` with a JSON body. The two inference
    verbs wrap a standard Google `GenerateContentRequest` under a `"request"`
    key and add companion-project routing fields at the top level. Responses
    wrap the Google-native body under a `"response"` key and carry a
    `"traceId"`. SSE streams (`?alt=sse`) emit `data:` frames of exactly that
    wrapped shape — `data: {"response": {…GenerateContentResponse…},
    "traceId": "…", "metadata": {}}`.

    Companion project: consumer (personal Google One) accounts do not provision
    a GCP project; `loadCodeAssist` returns the fixed companion project
    `aicode-consumers`, which the CLI stamps into every subsequent call's
    `"project"` field. Requests without a project are still served but are the
    documented trigger for HTTP 429 `RESOURCE_EXHAUSTED` under load.

    Auth (wire truth, binary + live 2026-11-07): OAuth2 Authorization Code +
    PKCE (S256). Authorize endpoint `https://accounts.google.com/o/oauth2/auth`
    (exact string in the binary; the `/v2/` variant appears nowhere). The CLI's
    login surface is **web-hosted, not loopback**: the flow completes at
    `https://antigravity.google/oauth-callback` (the CLI prints a sign-in link
    for the user — "Share this sign-in link with the user" — and polls for the
    result; success page `https://antigravity.google/auth-success?app=…`). The
    1.5.3 bundle adds a loopback bridge on the fixed port `127.0.0.1:4713`
    (path `/auth/callback`, also the CLI's local RPC/agent bridge), but the
    login redirect URI remains the web host. Token exchange at
    `https://oauth2.googleapis.com/token`; the standard
    `urn:ietf:params:oauth:grant-type:device_code` grant is also present in the
    auth stack, and `code_challenge` / `code_challenge_method` confirm PKCE is
    in the CLI's own authorize parameters. Scopes extracted from the binary:
    `cloud-platform`, `userinfo.email`, `userinfo.profile`, `cclog`,
    `experimentsandconfigs`, `aicode` (plus `offline_access` — present as a
    string in 1.5.3 — and drive.* scopes used by auxiliary lanes). `openid` /
    `access_type=offline` / `prompt=consent` / `include_granted_scopes` still
    appear **nowhere** in the CLI's OAuth parameter strings — first-party
    integrations that send them are client-side extensions, not wire truth.
    Three client identities exist in the 1.5.3 bundle: the Cloud Code IDE pair,
    the standalone CLI pair, and a business/BAIC pair discovered by the
    `SetBusinessOAuthClientIDOverride` symbol (see `x-cli-constants`).

    Client identity (the admission gate): the backend routes inference only for
    requests whose `User-Agent` carries the `antigravity/cli/` brand. The full
    observed form is
    `antigravity/cli/{version} (aidev_client; os_type={os}; arch={arch}; cl={build}; auth_method={method})`
    — live capture of 1.5.3:
    `antigravity/cli/1.5.3 (aidev_client; os_type=linux; arch=amd64; cl=1016078699; auth_method=consumer)`.
    Since 1.5.x the CLI speaks **HTTP/2** to every Cloud Code endpoint (the
    TLS ClientHello and HTTP/2 framing are part of its observable identity; see
    `x-network-fingerprint`). Differential probing (live) established:
    - `cl=` is **not** discriminated (`cl=0` and the real build number are both admitted).
    - `auth_method=consumer` matches subscription accounts; `business` exists in
      the bundle for enterprise surfaces.
    - The `cli` brand segment is load-bearing: the legacy `antigravity/{version}`
      form (no brand) was rejected with `404 NOT_FOUND` before inference routing
      in earlier backend generations. As of this capture both branded and
      unbranded forms reach inference, but the brand remains the safe invariant.
    - `x-goog-api-client` (`gl-go/1.23.2 gdcl/0.1`) is **not** sent by the
      real CLI at all and is ignored by the backend. Nuo no longer stamps it —
      marker parity with a header the real client never sends is
      distinguishability debt, not fidelity.
  x-provenance: live + bundle
  x-cli-constants:
    cliVersion: 1.5.3
    # The `cl=` counter stamped into the User-Agent, live-captured 2026-11-07.
    cliBuildNumber: "1016078699"
    releaseStamp: 1.5.3-6604829099950080
    toolchain: go1.28-20261102-RC00 cl/1012564305 +298f53e483 X:fieldtrack,boringcrypto,simd,nogolistexportnewformat
    binarySizeBytes: 246837648
    clientKind: aidev_client
    authMethodConsumer: consumer
    oauth:
      authorizeUrl: https://accounts.google.com/o/oauth2/auth
      tokenUrl: https://oauth2.googleapis.com/token
      deviceAuthorizationUrl: https://oauth2.googleapis.com/device/code
      redirectUris:
        - https://antigravity.google/oauth-callback
      redirectNote: >-
        Web-hosted completion (antigravity.google), not a loopback redirect:
        the CLI prints the sign-in link and polls for the result. 1.5.3 also
        compiles a fixed loopback bridge at 127.0.0.1:4713 (path
        /auth/callback) for its local RPC/agent surface, but the login redirect
        URI remains https://antigravity.google/oauth-callback. The constant
        51121 still appears nowhere (it was a nuo invention).
      clientMetadataUrl: https://antigravity.google/oauth/client-metadata.json
      # OAuth credentials are recorded as redacted placeholders, never literals:
      # the live pair is embedded in the public CLI binary and mirrored by
      # `providers/nuo-provider-google-antigravity/src/oauth.rs`. A repository
      # does not need a second copy of a live credential, and copying one here
      # trips secret-scanning push protection. What this file owns is provenance
      # and shape, not the secret.
      cloudCodeClientId: "<redacted: Google OAuth client id>"
      cloudCodeClientSecret: "<redacted>"
      cliClientId: "<redacted: Google OAuth client id>"
      cliClientSecret: "<redacted>"
      # Third pair, new in 1.5.x. Role is inferential, not proven: the client id
      # sits in the auth/config string region next to "BAIC Telemetry Client" /
      # "InferenceInteraction", and the bundle carries both
      # SetOAuthClientIDOverride and SetBusinessOAuthClientIDOverride. The pair
      # below is therefore recorded as the *candidate business/BAIC* pair, not
      # as a consumer-flow fact.
      businessClientId:
        value: "<redacted: Google OAuth client id>"
        provenance: bundle
        confidence: inferential
      businessClientSecret:
        value: "<redacted>"
        provenance: bundle
        confidence: inferential
      scopes:
        - https://www.googleapis.com/auth/cloud-platform
        - https://www.googleapis.com/auth/userinfo.email
        - https://www.googleapis.com/auth/userinfo.profile
        - https://www.googleapis.com/auth/cclog
        - https://www.googleapis.com/auth/experimentsandconfigs
        - https://www.googleapis.com/auth/aicode
      scopeNote: >-
        Extracted from the binary's scope strings (live 2026-11-07); `openid`,
        `access_type=offline`, `prompt=consent` and `include_granted_scopes`
        appear nowhere in the CLI's OAuth parameter strings and are NOT part
        of the observed request set. `offline_access` now exists as a string in
        1.5.3, but the observed authorize parameter set is unchanged; PKCE
        (`code_challenge`, `code_challenge_method`) is confirmed present.
        First-party integrations that add the missing parameters are
        client-side extensions, not wire truth.
    companionProject: aicode-consumers
    defaultTierId: free-tier
    minAdmittedProductVersion: "1.2"
    userAgents:
      real153: antigravity/cli/1.5.3 (aidev_client; os_type=linux; arch=amd64; cl=1016078699; auth_method=consumer)
      nuoEmulated: antigravity/cli/1.5.3 (aidev_client; os_type=linux; arch=amd64; cl=1016078699; auth_method=consumer)
      real136Legacy: antigravity/cli/1.3.6 (aidev_client; os_type=linux; arch=amd64; cl=999748552; auth_method=consumer)
    requestHeaders:
      summary: >-
        The shipped 1.5.3 client sends exactly four request headers on every
        Cloud Code call: Authorization, Content-Type, Accept-Encoding,
        User-Agent. No `x-goog-api-client`, no other client-identity marker.
        Plus the HTTP/2 transport's implicit `:authority`, `:method`, `:path`,
        `:scheme` and `content-length`. Header insertion order across the four
        is not stable (Go map iteration); four permutations were observed on
        the wire (see `x-network-fingerprint.headerOrder`).
      transport: h2
    otherHosts:
      aicode: https://aicode.googleapis.com
      aicodeConfigVerb: https://aicode.googleapis.com/v1alpha:fetchConfig
      businessAicode: businessaicode.googleapis.com
      preprod: https://preprod-daily-cloudcode-pa.sandbox.googleapis.com
      telemetry: https://play.googleapis.com/log
      autoUpdater: https://antigravity-cli-auto-updater-974169037036.us-central1.run.app
      pluginsMarketplace: https://www.gstatic.com/antigravity/plugins/marketplace.json
  license:
    name: Internal reference
    url: https://antigravity.google/docs/cli/reference

externalDocs:
  description: Antigravity CLI reference
  url: https://antigravity.google/docs/cli/reference

servers:
  - url: https://daily-cloudcode-pa.googleapis.com
    description: Production (daily ring; the shipped CLI default)
  - url: https://cloudcode-pa.googleapis.com
    description: Production (stable ring)
  - url: https://preprod-daily-cloudcode-pa.sandbox.googleapis.com
    description: Pre-production (bundle-only)

security:
  - OAuthBearer: []

tags:
  - name: account
    description: Entitlement, onboarding, user info and settings.
  - name: catalog
    description: Live model catalog and experiment flags.
  - name: inference
    description: The v1internal GenerateContent envelope (SSE + unary).
  - name: quota
    description: Windowed usage meters.
  - name: trajectory
    description: Conversation-trajectory ACL surface.

paths:
  /v1internal:loadCodeAssist:
    post:
      operationId: loadCodeAssist
      tags: [account]
      summary: Entitlement probe — tier, allowed tiers and companion project
      x-provenance: live
      description: |
        First call of every session (the CLI's "eligibility check"). Returns the
        account's tier inventory and the companion project to route with.

        The real client sends the **minimal** body `{"metadata":
        {"ideType": "ANTIGRAVITY"}}` — no ideVersion/ideName/platform/pluginType.
        Re-confirmed byte-for-byte on 1.5.3 (`Content-Length: 38`). A richer
        metadata object (ideVersion, ideName, platform=LINUX_AMD64,
        pluginType=GEMINI, as the older Cloud Code clients sent) is also
        accepted (live probe: 200). The minimal form is the wire-truth.

        `metadata.ideType` is the only field with observed effect; the response
        is the same either way for a signed-in consumer account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadCodeAssistRequest"
            examples:
              agy153:
                summary: Exact body the shipped 1.5.3 CLI sends (x-provenance live)
                value:
                  metadata:
                    ideType: ANTIGRAVITY
              richLegacy:
                summary: Older Cloud Code metadata shape (x-provenance live — also admitted)
                value:
                  metadata:
                    ideType: ANTIGRAVITY
                    ideVersion: 1.3.6
                    ideName: antigravity
                    platform: LINUX_AMD64
                    pluginType: GEMINI
      responses:
        "200":
          description: >-
            Entitlement view. `cloudaicompanionProject` is the routing project
            for all subsequent calls (`aicode-consumers` for consumer
            accounts); it may also appear as `response.cloudaicompanionProject`
            on the wrapped JSON form. Tier ids observed live: `free-tier`
            (default, `isDefault: true`), `standard-tier`
            (`userDefinedCloudaicompanionProject: true`, `usesGcpTos: true`).
            Ineligibility reasons come from the descriptor's
            `IneligibleTierReasonCodes` enum (INELIGIBLE_ACCOUNT,
            UNKNOWN_LOCATION, UNSUPPORTED_LOCATION, RESTRICTED_NETWORK,
            RESTRICTED_AGE, NON_USER_ACCOUNT, DASHER_USER, BYOID_USER,
            RESTRICTED_DASHER_USER, VALIDATION_REQUIRED,
            GOOGLE_TOS_NOT_SUPPORTED_BY_CLIENT, UNSUPPORTED_CLIENT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadCodeAssistResponse"
              examples:
                consumerFree:
                  x-provenance: live
                  value:
                    allowedTiers:
                      - id: free-tier
                        name: Antigravity
                        isDefault: true
                        description: Gemini-powered code suggestions and chat in multiple IDEs
                        privacyNotice:
                          showNotice: true
                          noticeText: >-
                            This notice and our Privacy Policy -
                            https://policies.google.com/privacy - describe how Gemini
                            Code Assist for individuals handles your data.
                      - id: standard-tier
                        name: Antigravity
                        description: Unlimited coding assistant with the most powerful Gemini models
                        privacyNotice: {}
                        userDefinedCloudaicompanionProject: true
                        usesGcpTos: true
                    cloudaicompanionProject: aicode-consumers
                    currentTier:
                      id: free-tier
                      name: Antigravity
                      isDefault: true
                      description: Gemini-powered code suggestions and chat in multiple IDEs
                      privacyNotice:
                        showNotice: true
                        noticeText: >-
                          This notice and our Privacy Policy -
                          https://policies.google.com/privacy - describe how Gemini
                          Code Assist for individuals handles your data.
                    allowedTiersNote: >-
                      Field names are camelCase on this surface; older
                      integrations also tolerate snake_case aliases
                      (paid_tier / allowed_tiers / current_tier), which the
                      first-party clients never send.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1internal:onboardUser:
    post:
      operationId: onboardUser
      tags: [account]
      summary: Provision the companion project for a tier
      x-provenance: bundle
      description: |
        Used only when `loadCodeAssist` comes back without a
        `cloudaicompanionProject` (first run of a new account). The client picks
        a `tierId` (the first allowed tier from the `loadCodeAssist` response —
        `free-tier` for consumer accounts) and posts it with
        the same metadata block. The response carries the newly provisioned
        project; the client re-runs `loadCodeAssist` afterwards to confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardUserRequest"
            examples:
              consumer:
                value:
                  tierId: free-tier
                  metadata:
                    ideType: ANTIGRAVITY
      responses:
        "200":
          description: >-
            Onboarded project descriptor. Project ids arrive either bare
            (`aicode-consumers`), numeric, or `projects/`-prefixed; all three
            forms are accepted downstream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1internal:fetchUserInfo:
    post:
      operationId: fetchUserInfo
      tags: [account]
      summary: Region code and per-project user settings
      x-provenance: live
      description: |
        Called twice per session: once without a project (bootstrap) and once
        with `{"project": "…"}` after the companion project is resolved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRequest"
            examples:
              bootstrap:
                value: {}
              withProject:
                value:
                  project: aicode-consumers
      responses:
        "200":
          description: Region and settings (both shapes observed live).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"
              examples:
                bootstrap:
                  x-provenance: live
                  value:
                    regionCode: JP
                    userSettings: {}
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1internal:setUserSettings:
    post:
      operationId: setUserSettings
      tags: [account]
      summary: Persist per-user settings
      x-provenance: bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project:
                  type: string
                userSettings:
                  type: object
      responses:
        "200":
          description: Settings accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1internal:setCodeAssistGlobalUserSetting:
    post:
      operationId: setCodeAssistGlobalUserSetting
      tags: [account]
      summary: Global (cross-project) Code Assist setting write
      x-provenance: bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1internal:getCodeAssistGlobalUserSetting:
    post:
      operationId: getCodeAssistGlobalUserSetting
      tags: [account]
      summary: Global (cross-project) Code Assist setting read
      x-provenance: bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyResponse"
      responses:
        "200":
          description: Current global settings object.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1internal:fetchAvailableModels:
    post:
      operationId: fetchAvailableModels
      tags: [catalog]
      summary: Live model catalog — the authoritative model list
      x-provenance: live
      description: |
        Body is exactly `{"project": "…"}`. The response is the **live**
        (Layer-2) catalog: agent model groups with display ordering, dedicated
        per-lane model ids (command, commit-message, image-generation,
        audio-transcription, web-search, mquery, tab chat proxies), the default
        agent model, per-model definitions (`models.{id}`) carrying
        context/output limits, provider enum, effort metadata and per-model
        experiment configs, plus the experiment id list the account is
        enrolled in.

        **Wire entity routing (live 2026-10-23, paid-pro account):** the two
        inference verbs accept only *registered* ids. Per-level entries ride
        both the catalog rows and `tieredModelIds` for every tier:
        `tieredModelIds: {flashLite: [gemini-3.5-flash-lite], flash: [gemini-3.8-flash-tiered],
        pro: [gemini-3.8-flash-tiered]}` — flash/pro tiers route through the
        canonical `gemini-3.8-flash-tiered` entity, whose depth is chosen
        in-band (`generationConfig.thinkingLevel`). Gemini 4 Argon carries **no
        tiered canonical entity**: the account surface lists only
        `gemini-4-argon-{low,medium,high}` (catalog rows flagged `recommended`,
        `tagTitle: "New"`, `thinkingLevel: 1|2|3`), and the bare
        `gemini-4-argon` id 404s (`Requested entity was not found`, live on
        both `generateContent` and `streamGenerateContent`). Argon's wire
        effort surface is therefore the entity suffix. Accounts **without**
        Argon entitlement observe `gemini-4-argon-disabled` (the catalog row's
        boolean `disabled: true` form folds into the `-disabled` suffix id
        the CLI model picker suppresses).

        Paid-pro surface observed 2026-10-23:
        `defaultAgentModelId: gemini-4-argon-medium`;
        recommended sort order `gemini-4-argon-{medium,high,low}`,
        `gemini-3.8-flash-{high,medium,low}`, `claude-{opus,sonnet}-5-5-{low,medium,high}`,
        `gpt-oss-120b-medium` (deeper claude-sonnet/opus-4-6 ids remain valid
        legacy-tier rows; the 5-5 family exposes a `-max` entity too — display
        `Claude Opus 5.5 (Max)` in the shipped 1.4.0 picker — but the curated
        pro surface omits it; the bare `claude-{opus,sonnet}-5-5` ids 404 and
        route through the per-level entities exactly as argon does).
        Lane models observed: command `gemini-3-flash`,
        commit-message `gemini-3.5-flash-lite`, image `gemini-3.1-flash-image`,
        audio `models/proactive-observer-v10`, web-search/mquery
        `gemini-3.5-flash-lite`, tab `chat_20706`/`chat_23310` (internal
        helpers, never user-selectable).

        Model definition notes (from the live catalog):
        - `apiProvider` discriminates the upstream lane:
          `API_PROVIDER_INTERNAL` (legacy first-party rows),
          `API_PROVIDER_GOOGLE_GEMINI` (Argon/3.8 rows),
          `API_PROVIDER_ANTHROPIC_VERTEX` (Claude via Vertex),
          `API_PROVIDER_OPENAI_VERTEX` (GPT-OSS via Vertex).
        - `model` is the internal enum label echoed in request
          `labels.model_enum`, not a wire id — first-party Argon/3.8 rows use
          `MODEL_PLACEHOLDER_M*` (M318/319/320 = 3.8-flash high/medium/low,
          M322 = `gemini-3.8-flash-tiered`, M417/418/419 = argon
          high/medium/low); third-party rows carry named enums
          (`MODEL_OPENAI_GPT_OSS_120B_MEDIUM`).
        - `maxTokens` is the context ceiling (1048576 for Gemini/Argon and the
          5-5 Claude generation), `maxOutputTokens` the per-turn output cap
          (65536 Gemini rows, 128000 Claude 5-5 rows, 32768 GPT-OSS).
        - Per-level depth metadata rides the row:
          `thinkingLevel: 1|2|3` (catalog → `LOW|MEDIUM|HIGH`), plus
