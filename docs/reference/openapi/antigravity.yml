components:
  securitySchemes:
    OAuthBearer:
      type: http
      scheme: bearer
      bearerFormat: Google OAuth2 access token (ya29.…)
      description: >-
        Google-issued access token from the Antigravity OAuth clients; scopes
        per `info.x-cli-constants.oauth.scopes`. Refreshed via
        `oauth2.googleapis.com/token` with the paired client secret.

  parameters:
    AltSse:
      name: alt
      in: query
      required: true
      schema:
        type: string
        enum: [sse]
      description: Required on the streaming verb; selects the SSE framing.

  schemas:
    Metadata:
      type: object
      description: >-
        Client metadata block (`ClientMetadata` proto, extracted from the
        binary's descriptor, 2026-10-14). The shipped CLI sends the minimal
        form — `ideType: "ANTIGRAVITY"` only.
      properties:
        ideType:
          type: string
          enum:
            - IDE_UNSPECIFIED
            - VSCODE
            - INTELLIJ
            - VSCODE_CLOUD_WORKSTATION
            - INTELLIJ_CLOUD_WORKSTATION
            - CLOUD_SHELL
            - CIDER
            - CLOUD_RUN
            - ANDROID_STUDIO
            - ANTIGRAVITY
            - JETSKI
            - COLAB
            - FIREBASE
            - CHROME_DEVTOOLS
            - GEMINI_CLI
        ideVersion:
          type: string
        pluginVersion:
          type: string
        platform:
          type: string
          enum:
            - PLATFORM_UNSPECIFIED
            - DARWIN_AMD64
            - DARWIN_ARM64
            - LINUX_AMD64
            - LINUX_ARM64
            - WINDOWS_AMD64
          description: Proto descriptor enum; the shipped CLI omits this field on the minimal body.
        updateChannel:
          type: string
        duetProject:
          type: string
        pluginType:
          type: string
          enum:
            - PLUGIN_UNSPECIFIED
            - CLOUD_CODE
            - GEMINI
            - AIPLUGIN_INTELLIJ
            - AIPLUGIN_STUDIO
            - PANTHEON
        ideName:
          type: string

    LoadCodeAssistRequest:
      type: object
      description: >-
        Proto fields (descriptor, 2026-10-14): `cloudaicompanionProject`,
        `metadata`, `mode`. The shipped CLI sends only `metadata` with the
        minimal ideType.
      properties:
        cloudaicompanionProject:
          type: string
          description: Optional project hint; consumer accounts omit it and receive `aicode-consumers`.
        metadata:
          $ref: "#/components/schemas/Metadata"
        mode:
          type: string
          enum: [MODE_UNSPECIFIED, FULL_ELIGIBILITY_CHECK, HEALTH_CHECK]
          description: >-
            Request mode from the proto descriptor; the shipped CLI sends no
            `mode` (server default).

    Tier:
      type: object
      properties:
        id:
          type: string
          description: Observed ids `free-tier`, `standard-tier`.
        name:
          type: string
        description:
          type: string
        isDefault:
          type: boolean
        privacyNotice:
          type: object
          properties:
            showNotice:
              type: boolean
            noticeText:
              type: string
        userDefinedCloudaicompanionProject:
          type: boolean
        usesGcpTos:
          type: boolean

    LoadCodeAssistResponse:
      type: object
      properties:
        allowedTiers:
          type: array
          items:
            $ref: "#/components/schemas/Tier"
        currentTier:
          $ref: "#/components/schemas/Tier"
        cloudaicompanionProject:
          type: string
          description: Companion project to route all subsequent calls with.

    OnboardUserRequest:
      type: object
      description: >-
        Proto fields (descriptor, 2026-10-14): `tierId`, `metadata`,
        `cloudaicompanionProject`. The shipped CLI sends `tierId` + minimal
        metadata.
      properties:
        tierId:
          type: string
        metadata:
          $ref: "#/components/schemas/Metadata"
        cloudaicompanionProject:
          type: string

    OnboardUserResponse:
      type: object
      properties:
        cloudaicompanionProject:
          oneOf:
            - type: string
            - type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                projectNumber:
                  type: string
          description: >-
            Bare id, `projects/`-prefixed id, numeric id or a descriptor object;
            all forms are observed by the first-party extraction logic.

    ProjectRequest:
      type: object
      description: The minimal shared body of project-scoped non-inference verbs.
      properties:
        project:
          type: string
          description: Companion project (e.g. `aicode-consumers`); omitted on bootstrap calls.

    UserInfoResponse:
      type: object
      properties:
        regionCode:
          type: string
        userSettings:
          type: object
          additionalProperties: true

    ListExperimentsResponse:
      type: object
      properties:
        experimentIds:
          type: array
          items:
            type: integer
            format: int64

    EmptyResponse:
      type: object
      additionalProperties: true

    ModelQuotaInfo:
      type: object
      properties:
        remainingFraction:
          type: number
          format: float

    QuotaBucket:
      type: object
      description: One windowed meter (weekly / 5h) for a model group.
      properties:
        bucketId:
          type: string
          description: Observed ids `gemini-weekly`, `gemini-5h`, `3p-weekly`, `3p-5h`.
        displayName:
          type: string
        description:
          type: string
        remainingFraction:
          type: number
          format: float
          description: 0..1 remaining share of the window.
        remainingAmount:
          type: integer
        resetTime:
          type: string
          format: date-time
        window:
          type: string
          enum: [weekly, 5h]
        disabled:
          type: boolean

    QuotaGroup:
      type: object
      properties:
        displayName:
          type: string
          description: Observed groups "Gemini Models" and "Claude and GPT models".
        description:
          type: string
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/QuotaBucket"

    QuotaSummaryResponse:
      type: object
      properties:
        description:
          type: string
        groups:
          type: array
          items:
            $ref: "#/components/schemas/QuotaGroup"
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/QuotaBucket"
          description: Legacy flat rows; present on the pre-summary surface.

    ModelDefinition:
      type: object
      description: Per-model catalog row (`models.{id}`).
      properties:
        model:
          type: string
          description: >-
            Internal enum label echoed in request labels; `MODEL_PLACEHOLDER_M*`
            for first-party rows (M318/319/320 = gemini-3.8-flash
            high/medium/low, M322 = gemini-3.8-flash-tiered, M417/418/419 =
            argon high/medium/low), named enums for third-party rows
            (e.g. `MODEL_OPENAI_GPT_OSS_120B_MEDIUM`).
        displayName:
          type: string
        apiProvider:
          type: string
          enum: [API_PROVIDER_INTERNAL, API_PROVIDER_GOOGLE_GEMINI, API_PROVIDER_ANTHROPIC_VERTEX, API_PROVIDER_OPENAI_VERTEX]
        modelProvider:
          type: string
          enum: [MODEL_PROVIDER_GOOGLE, MODEL_PROVIDER_ANTHROPIC, MODEL_PROVIDER_OPENAI]
        isInternal:
          type: boolean
        maxTokens:
          type: integer
          description: Context ceiling (1048576 on the 2026-10-23 argon/3.8/claude-5-5 rows).
        maxOutputTokens:
          type: integer
          description: Per-turn output cap (65536 Gemini rows, 128000 Claude 5-5, 32768 GPT-OSS).
        supportsThinking:
          type: boolean
        thinkingLevel:
          type: integer
          description: >-
            Catalog-side depth rank 1|2|3 (→ LOW|MEDIUM|HIGH). Present on
            per-level rows (argon, claude-5-5); absence with
            `thinkingBudget: -1` means "canonical row, depth chosen in-band".
        thinkingBudget:
          type: integer
          description: "-1 = auto (server picks). Positive = fixed budget (e.g. gemini-3.8-flash-low = 1000, gemini-3.8-flash-medium = 4000, gpt-oss-120b-medium = 8192)."
        minThinkingBudget:
          type: integer
          description: Minimum accepted in-band budget (32 on every Gemini row observed).
        recommended:
          type: boolean
          description: Account-surface recommendation flag (all paid-pro sort rows carry true).
        disabled:
          type: boolean
          description: >-
            Entitlement gate (tier lock). True rows surface in the CLI picker
            folded to the `-disabled` suffix id (e.g. `gemini-4-argon-disabled`
            for accounts without Argon tier); usable for the signed-in tier's
            rows are absent from `models` or `disabled` false.
        beta:
          type: boolean
        tagTitle:
          type: string
          description: Picker badge ("New", "Notice").
        promptTemplaterType:
          type: string
        toolFormatterType:
          type: string
        quotaInfo:
          $ref: "#/components/schemas/ModelQuotaInfo"
        supportsCumulativeContext:
          type: boolean
        supportsImages:
          type: boolean
        supportsVideo:
          type: boolean
        requiresLeadInGeneration:
          type: boolean
        supportedMimeTypes:
          type: object
          additionalProperties:
            type: boolean
          description: >-
            Admissible MIME → bool map riding the row (audio/video/image/doc
            families observed on argon & 3.8 rows).
        modelExperiments:
          type: object
          additionalProperties: true
          description: Per-model Mendel experiment overrides (JSON strings).

    AgentModelSort:
      type: object
      properties:
        displayName:
          type: string
        groups:
          type: array
          items:
            type: object
            properties:
              modelIds:
                type: array
                items:
                  type: string

    AvailableModelsResponse:
      type: object
      properties:
        defaultAgentModelId:
          type: string
          description: >-
            Account-surface default agent entity. Paid-pro 2026-10-23:
            `gemini-4-argon-medium` (a per-level argon entity); free-tier
            2026-10-14: `gemini-3.8-flash`.
        agentModelSorts:
          type: array
          items:
            $ref: "#/components/schemas/AgentModelSort"
        tieredModelIds:
          type: object
          description: >-
            Tier-folded canonical entities — flash/pro route through
            `gemini-3.8-flash-tiered` (depth in-band); flashLite through
            `gemini-3.5-flash-lite`. Argon is never present here; its
            depth lives in per-level entities under `models` +
            `agentModelSorts`.
          properties:
            flashLite:
              type: array
              items:
                type: string
            flash:
              type: array
              items:
                type: string
            pro:
              type: array
              items:
                type: string
        commandModelIds:
          type: array
          items:
            type: string
        commitMessageModelIds:
          type: array
          items:
            type: string
        imageGenerationModelIds:
          type: array
          items:
            type: string
        audioTranscriptionModelIds:
          type: array
          items:
            type: string
        webSearchModelIds:
          type: array
          items:
            type: string
        mqueryModelIds:
          type: array
          items:
            type: string
        tabModelIds:
          type: array
          items:
            type: string
          description: Internal tab-chat proxy ids (chat_20706/chat_23310) — never user-selectable.
        models:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ModelDefinition"
        experimentIds:
          type: array
          items:
            type: integer
            format: int64

    ThinkingConfig:
      type: object
      description: >-
        Google thinking surface, two admissible live shapes — but their
        availability is ENTITY-scoped (live 2026-10-23):
        the canonical `-tiered` rows (gemini-3.8-flash-tiered, and the
        suffix-less legacy rows) accept `generationConfig.thinkingConfig`
        (`{includeThoughts: true, thinkingBudget: -1}` auto-budget on main
        agent turns, `{includeThoughts: true, thinkingLevel: "LOW"}` on the
        title lane). The argon per-level entities REJECT the in-band object
        with 400 `Invalid JSON payload received. Unknown name
        "thinkingConfig" at 'request': Cannot find field.` — their depth is
        the entity suffix. The whole object is omitted on downgrade when the
        upstream refuses it.
      properties:
        includeThoughts:
          type: boolean
        thinkingBudget:
          type: integer
          description: "-1 = auto."
        thinkingLevel:
          type: string
          enum: [LOW, MEDIUM, HIGH]

    GenerateContentRequest:
      type: object
      description: Standard Google GenerateContentRequest (subset that the CLI exercises).
      properties:
        contents:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, model]
              parts:
                type: array
                items:
                  type: object
                  properties:
                    text:
                      type: string
                    thought:
                      type: boolean
                    thoughtSignature:
                      type: string
                    inlineData:
                      type: object
                      properties:
                        mimeType:
                          type: string
                        data:
                          type: string
        systemInstruction:
          type: object
          description: Role is `"user"` on this surface (Google-native quirk, observed live).
          properties:
            role:
              type: string
            parts:
              type: array
              items:
                type: object
                properties:
                  text:
                    type: string
        generationConfig:
          type: object
          properties:
            maxOutputTokens:
              type: integer
            thinkingConfig:
              $ref: "#/components/schemas/ThinkingConfig"
        labels:
          type: object
          additionalProperties:
            type: string
          description: >-
            Free-form telemetry map (cascade/trajectory/request ids,
            `model_enum`, `used_claude*`, `used_non_gemini_model`) on main
            agent turns.
        sessionId:
          type: string
          description: Numeric session id string, duplicated at envelope level.

    StreamGenerateContentEnvelope:
      type: object
      required: [model, project, request]
      properties:
        model:
          type: string
          description: >-
            Wire model id — MUST be a registered PredictionService entity.
            Registered (live 2026-10-23): `gemini-4-argon-{low,medium,high}`
            (argon/claude-5.5 depth = entity suffix),
            `gemini-3.8-flash-tiered` and the
            `gemini-3.8-flash-{high,medium,low}` rows,
            `claude-{opus,sonnet}-4-6(-thinking)`,
            `claude-{opus,sonnet}-5-5-{low,medium,high,max}`,
            `gpt-oss-120b-medium`, `gemini-3.5-flash-lite`. Unregistered
            (→404 Requested entity was not found): `gemini-4-argon`,
            `gemini-3.8-flash` (bare), the bare Claude 5.5 ids
            (`claude-opus-5-5`, `claude-sonnet-5-5` — 404 in real `agy`
            sessions, 2026-10-17), invented suffixes
            (`gemini-4-argon-thinking`).
        project:
          type: string
        request:
          $ref: "#/components/schemas/GenerateContentRequest"
        requestId:
          type: string
          description: "`checkpoint/{uuid-v4}` on title/checkpoint lanes."
        requestType:
          type: string
          enum: [checkpoint]
        userAgent:
          type: string
          description: Brand echo `"antigravity"` (not the UA header value); title lane only.
        sessionId:
          type: string

    Candidate:
      type: object
      properties:
        content:
          type: object
          properties:
            role:
              type: string
            parts:
              type: array
              items:
                type: object
                properties:
                  text:
                    type: string
                  thought:
                    type: boolean
                  thoughtSignature:
                    type: string
        finishReason:
          type: string
          enum: [STOP]

    UsageMetadata:
      type: object
      properties:
        promptTokenCount:
          type: integer
        candidatesTokenCount:
          type: integer
        thoughtsTokenCount:
          type: integer
        totalTokenCount:
          type: integer

    StreamFrame:
      type: object
      description: One SSE `data:` payload — the wrapped GenerateContentResponse.
      properties:
        response:
          type: object
          properties:
            candidates:
              type: array
              items:
                $ref: "#/components/schemas/Candidate"
            usageMetadata:
              $ref: "#/components/schemas/UsageMetadata"
            modelVersion:
              type: string
              description: >-
                Concrete serving version, may differ from the requested id
                (live 2026-10-23: argon per-level entities serve as
                `gemini-4-argon-trial`; `gemini-3.8-flash-high` served as
                `gemini-3.8-flash-n`).
            responseId:
              type: string
        traceId:
          type: string
          description: 16-hex per-stream chain-of-custody id.
        metadata:
          type: object
          additionalProperties: true

    ErrorBody:
      type: object
      description: Google gstatus error shape with an error object of code, message and status.
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            status:
              type: string

  responses:
    Unauthorized:
      description: Bearer rejected or expired (CLI force-refreshes and replays once on 401).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    ResourceExhausted:
      description: >-
        429 quota exhaustion; classically triggered when the `project` field is
        missing (no `cloudaicompanionProject` routing) or a window bucket is
        spent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

x-admission-band:
  summary: >-
    Live differential probe results (2026-10-14, re-probed 2026-10-23, all
    endpoints 200 unless noted). Policy: the pin tracks the shipped client —
    the realistic band-narrowing direction is the floor rising under an
    auto-updating wild client population, which retires floor-hugging pins
    first, so the top of the band is the max-headroom seat.
  userAgents:
    - value: antigravity/cli/1.5.3 (aidev_client; os_type=linux; arch=amd64; cl=1016078699; auth_method=consumer)
      verdict: admitted on 2026-11-07 (the shipped 1.5.3 identity; account/catalog verbs 200, inference later blocked by TOS_VIOLATION — an account action, not a UA rejection; see x-risk-control)
    - value: antigravity/cli/1.4.0 (aidev_client; os_type=linux; arch=amd64; cl=999748552; auth_method=consumer)
      verdict: admitted (re-probed 2026-10-23 — the installed 1.4.0 lineage reaches inference with the 1.3.6 build counter; see note below)
    - value: antigravity/cli/1.3.6 (aidev_client; os_type=linux; arch=amd64; cl=999748552; auth_method=consumer)
      verdict: admitted (the tracked 1.3.6 profile — re-admitted 2026-10-23)
    - value: antigravity/cli/1.3.5 (aidev_client; os_type=linux; arch=amd64; cl=998863838; auth_method=consumer)
      verdict: admitted (previous tracked profile)
    - value: antigravity/cli/1.2.12 (aidev_client; os_type=linux; arch=amd64; cl=0; auth_method=consumer)
      verdict: admitted on this capture (nuo's former pin; retired — cl=0 exists in no wild cohort)
    - value: antigravity/cli/1.2.0 (aidev_client; os_type=linux; arch=amd64; cl=0; auth_method=consumer)
      verdict: admitted on this capture (floor version still inside the band)
    - value: antigravity/1.2.12 (…) — no cli brand segment
      verdict: admitted on this capture (earlier backend generations 404'd this form; keep the brand)
  versionNote: >-
    The installed `agy` auto-updated from 1.5.2 to 1.5.3 mid-capture
    (246,837,648 bytes; build stamp 1.5.3-6604829099950080; go1.28-20261102-RC00
    cl/1012564305 +298f53e483, boringcrypto). The per-request `cl=` counter is
    therefore not discriminated (cl=0 admitted 2026-10-14; 1.4.0 + cl=999748552
    admitted 2026-10-23; 1.5.3 + cl=1016078699 admitted 2026-11-07). The brand
    `"antigravity/cli/"` segment and the `aidev_client; os_type; arch; …;
    auth_method=consumer` anatomy remain the load-bearing identity — the
    literal `antigravity/cli/{version}` string appears nowhere in the binary
    image (assembled at runtime from format pieces `os_type=%s` / `cl=%d` /
    `auth_method=%s` / `"%s/%s (%s)"` adjacent to the `User-Agent` constant in
    the string table), yet the live form still reads
    `antigravity/cli/{version} (…)` — the assembled product of those pieces.
  fullCombination:
    fact: tracked version 1.5.3 + real build cl=1016078699 + HTTP/2 + Go-shaped TLS hello + h2 framing + the four-header set
    verdict: admitted end-to-end on 2026-11-07 for account/catalog/quota traffic; inference returned 403 TOS_VIOLATION for this account (see x-risk-control) — the wire identity itself was not rejected.
  headers:
    - header: x-goog-api-client
      verdict: not sent by the real CLI; ignored by the backend. Removed from the nuo profile (2026-10-14) — marker parity with a header the real client never sends is distinguishability debt, not fidelity.
  bodyShapes:
    - fact: loadCodeAssist minimal metadata body
      verdict: admitted; the rich legacy metadata shape is also admitted. nuo mirrors the minimal form.

