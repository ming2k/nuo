      ["0x0904", "0x0905", "0x0906", "0x0804", "0x0403", "0x0807",
       "0x0805", "0x0806", "0x0401", "0x0501", "0x0601", "0x0503",
       "0x0603", "0x0201", "0x0203"]
    alpn: [h2, http/1.1]
    sni: present
    grease: false
    padding: false
    ja3: >-
      771,49195,49199,49196,49200,52393,52392,49161,49171,49162,49172,
      4865,4866,4867,0,11,65281,23,18,5,10,13,50,16,43,51,
      4588,4587,4589,29,23,24,25,0
    ja3Md5: 047514f2ccd8b013647df2d9e189c231
    ja4: t13d1312h1_7864b4adc6a0_cd1b3511567d_7117e252e3bb
  nuoImplementation:
    tlsProfile: netune::Preset::AntigravityCli ("antigravity-cli")
    http2Fingerprint: netune_http2::H2Fingerprint::go()
    selection: >-
      providers/nuo-provider-google-antigravity stamps
      RequestBuilder::tls_profile(ANTIGRAVITY_TLS_PROFILE) on every Cloud Code
      inference, retry, quota, loadCodeAssist and onboardUser request. The
      shared netune client uses TlsRouterConnector and enable_http2, so the same
      name selects the TLS hello and the h2 framing; netune keys its connection
      pool on the profile name, so a profiled request never reuses a
      default-identity socket. The generic fetchAvailableModels catalog fetch
      still presents the stock identity (it carries the 1.5.3 UA but not the
      named profile).
    residualDivergences:
      - >-
        rustls cannot offer Go's four CBC suites; the other nine are the same
        set but rustls emits them in provider order, so the JA3 cipher hash
        differs even though the set matches.
      - >-
        rustls has no renegotiation_info (ff01), extended_master_secret (0017),
        SCT (0012), status_request (0005), or ML-DSA (0904/0905/0906)
        implementations, and owns extension order — the JA3/JA4 extension hash
        cannot match Go's.
      - >-
        rustls has no SecP256r1MLKEM768 / SecP384r1MLKEM1024 (0x11eb/0x11ed),
        so two of Go's seven supported groups are absent.
    verdict: >-
      Negotiates like the CLI (h2 first, TLS 1.3, no GREASE, no browser
      extensions) and frames like Go; a byte-exact Go hello needs a Go-shaped
      TLS engine, not a rustls profile.

x-risk-control:
  summary: >-
    Observed enforcement of account risk control during the 2026-11-07 capture.
    The exact shape matters because it distinguishes an account action from a
    wire-identity rejection.
  provenance: live
  observedAt: 2026-11-07
  status: 403
  responseShape:
    code: 403
    status: PERMISSION_DENIED
    message: >-
      This service has been disabled in this account for violation of Terms of
      Service. Please submit an appeal to continue using this product.
    details:
      - "@type": type.googleapis.com/google.rpc.ErrorInfo
        reason: TOS_VIOLATION
        domain: cloudcode-pa.googleapis.com
        metadata:
          uiMessage: "true"
          appeal_url: https://forms.gle/hGzM9MEUv2azZsrb9
          appeal_url_link_text: Submit Appeal
  enforcementPoint: >-
    Inference only. On the same credential, loadCodeAssist,
    fetchAvailableModels, fetchAdminControls, listExperiments,
    retrieveUserQuotaSummary, fetchUserInfo, writeTrajectoryAcls, and
    aicode.googleapis.com/v1alpha:fetchConfig all returned 200; only
    v1internal:streamGenerateContent returned 403 TOS_VIOLATION. The block is
    therefore an account verdict applied at the inference verb, not a client
    admission failure.
  outOfBandChannels:
    - channel: clearcut
      endpoint: https://play.googleapis.com/log
      note: >-
        HTTP/2 POSTs carrying antigravity_ide_installation_id, client version,
        os/arch and log events. Runs regardless of inference admission, so it is
        a separate identity/fingerprint surface.
    - channel: crash/error reporting
      note: >-
        Error reports include Go stack traces; the CLI's error envelope also
        carries short_error/status/error_code/code_kind/retryable/error_id.
    - channel: auto-updater
      endpoint: https://antigravity-cli-auto-updater-974169037036.us-central1.run.app
      note: "Checked on a 15-minute floor (\"Last check was less than 15 minutes ago, skipping update\")."
  guidance: >-
    A 403 with reason TOS_VIOLATION is not fixable by changing the User-Agent,
    TLS profile, or client id — those were all accepted. It is an account-level
    action; the only in-band response is the appeal link. Keep this
    distinction when triaging provider failures: wire-identity problems surface
    as 404/400 at admission, risk-control as this 403 at inference.
