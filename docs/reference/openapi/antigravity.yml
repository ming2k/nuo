  /v1internal:streamGenerateContent:
    post:
      operationId: streamGenerateContent
      tags: [inference]
      summary: The inference envelope (SSE)
      x-provenance: live
      description: |
        The one inference endpoint the CLI drives. Always `POST`ed with
        `?alt=sse`; the request uses chunked transfer encoding (no
        Content-Length) and exactly four headers: `Authorization`,
        `Content-Type: application/json`, `Accept-Encoding: gzip`,
        `User-Agent`.

        Envelope (all fields observed live, top level):
        - `model` — the wire model id. **Routing is by registered
          PredictionService entity** (live 2026-10-23, both inference verbs):
          `gemini-4-argon` (bare) → HTTP 404
          `{"error":{"code":404,"message":"Requested entity was not
          found.","status":"NOT_FOUND"}}`; the per-level ids
          `gemini-4-argon-{low,medium,high}` serve 200 with
          `response.modelVersion = gemini-4-argon-trial`. For the
          gemini-3.8/3.5 families the registered entity is the canonical
          `-tiered`/suffix-less row and the depth rides in-band
          (`generationConfig.thinkingLevel`); for argon the suffix IS the
          depth surface (its rows carry `thinkingLevel: 1|2|3` and the
          upstream ignores an in-band `thinkingLevel` on argon with a 400
          `Unknown name "thinkingConfig"`). Observed working ids:
          `gemini-3.8-flash-high`, `gemini-4-argon-{low,medium,high}`,
          `claude-sonnet-4-6`, `gpt-oss-120b-medium`,
          `gemini-3.5-flash-lite` (title-generation lane).
        - `project` — companion project (`aicode-consumers`). Requests without
          it are still served (observed live 2026-10-23) but remain the
          documented 429 trigger under load.
        - `request` — a standard Google `GenerateContentRequest`.
        - `requestId` — `checkpoint/{uuid-v4}` when the turn is a title/
          checkpoint generation (`requestType: "checkpoint"`); absent on
          main agent turns (sampled live).
        - `requestType` — `"checkpoint"` on title/checkpoint lanes; absent on
          main agent turns.
        - `userAgent` — the string `"antigravity"` (brand echo, not the UA
          header value).
        - `sessionId` — numeric string id (negative int64 observed), constant
          across the session's turns.

        Inner `request` specifics observed live:
        - `contents[].role` is `user`; parts are `{"text": …}`.
        - `systemInstruction.role` is `"user"` (Google-native quirk), parts carry
          the composed system prompt.
        - `generationConfig.thinkingConfig`:
          main agent turns send `{"includeThoughts": true, "thinkingBudget":
          -1}` (auto budget); the title lane sends `{"includeThoughts": true,
          "thinkingLevel": "LOW"}`; `maxOutputTokens: 65536` on main turns.
        - `labels` — free-form string map on main turns (`cascade_id`,
          `trajectory_id`, `root_cascade_id`, `request_id` (uuid + step
          suffix), `last_step_index`, `model_enum`, `used_claude`,
          `used_claude_conservative`, `used_non_gemini_model`).
        - `sessionId` — repeated inside `request` as well as the envelope.

        Response: SSE `data:` frames, each a wrapped GenerateContentResponse:
        `{"response": {…}, "traceId": "{16 hex}", "metadata": {}}`. Frame
        anatomy (live):
        - `response.candidates[].content.role` = `"model"`.
        - Text parts `{"text": "…"}`; thought parts carry `"thought": true`;
          the terminal frame carries a base64 `thoughtSignature` on a
          zero-length text part together with `finishReason: "STOP"`.
        - **`thoughtSignature` site and replay contract** (live 2026-10-23,
          `v1internal:streamGenerateContent`): a signature validates against
          the exact bytes of the part that minted it, on the backend that
          minted it. Measured upstream behaviour:
          - Rejected with `400 INVALID_ARGUMENT "Corrupted thought
            signature."`: a garbage/tail-corrupted token, and a token replayed
            from a **different wire identity** (Vertex ↔ AI Studio, or a
            model/provider switch mid-session).
          - Accepted (200): changing `systemInstruction`, adding a tool,
            editing earlier call args/user text/`functionResponse`, swapping
            or cloning signatures between turns, and **omitting** the
            `thoughtSignature` field entirely (the missing-signature path
            degrades tool quality, it does not fail).
          - Presence rule: only the **newest** `functionCall` group must carry
            a signature (a real token or the
            `skip_thought_signature_validator` sentinel). Sibling calls of one
            parallel batch may go unsigned.
          - Consequence for clients: never relocate a token, and never replay one
            across a change of minting **backend**. The identity that gates
            replay must be the ingress authority *and* the model, not the model
            alone — the same id is served by AI Studio, by `v1internal`, and by
            any relay. A signature seen on a `thought: true` part, on one delta
            of a multi-delta answer, or on a turn minted elsewhere must be
            dropped (or, for a turn-level token, moved only onto that turn's
            leading `functionCall`) — never stamped onto text whose bytes it did
            not sign.
          - The terminal `{"text": "", "thoughtSignature": …}` frame arrives on
            essentially every answer, so its presence must not be read as
            contradicting a signature carried by the answer text itself; the two
            sign different things (turn vs. part bytes).
        - `response.usageMetadata` — `promptTokenCount`,
          `candidatesTokenCount`, `thoughtsTokenCount`, `totalTokenCount`
          (cumulative per stream).
        - `response.modelVersion` — the concrete serving version
          (`gemini-3.8-flash-n` served the `gemini-3.8-flash-high` request;
          `gemini-3.5-flash-lite` served itself).
        - `response.responseId` — stable across the stream's frames.
        - `traceId` — 16-hex chain-of-custody id, per stream.
        - No `error` framing was observed on the happy path; in-band errors
          surface as JSON `{"error": {…}}` bodies (Google gstatus shape) and
          quota exhaustion as HTTP 429 `RESOURCE_EXHAUSTED` with the project
          missing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamGenerateContentEnvelope"
            examples:
              mainAgentTurn:
                x-provenance: live
                value:
                  model: gemini-3.8-flash-high
                  project: aicode-consumers
                  sessionId: "-3750763034362895579"
                  request:
                    contents:
                      - role: user
                        parts:
                          - text: "Reply with exactly: CAPTURE-OK"
                    systemInstruction:
                      role: user
                      parts:
                        - text: "<identity>\nYou are Antigravity…"
                    generationConfig:
                      maxOutputTokens: 65536
                      thinkingConfig:
                        includeThoughts: true
                        thinkingBudget: -1
                    labels:
                      cascade_id: 578c9e7d-6201-44c5-a4b4-77010e74f4f8
                      root_cascade_id: 578c9e7d-6201-44c5-a4b4-77010e74f4f8
                      trajectory_id: c22ce54f-a322-4062-bbe8-51427381db64
                      request_id: c22ce54f-a322-4062-bbe8-51427381db64-0
                      last_step_index: "0"
                      model_enum: MODEL_PLACEHOLDER_M318
                      used_claude: "false"
                      used_claude_conservative: "false"
                      used_non_gemini_model: "false"
                    sessionId: "-3750763034362895579"
              argonPerLevelTurn:
                x-provenance: live
                summary: >-
                  Gemini 4 Argon routes by its per-level entity; depth never
                  appears in-band. Live 2026-10-23 (paid pro): 200,
                  modelVersion gemini-4-argon-trial. The bare `model:
                  gemini-4-argon` with this same body 404s.
                value:
                  model: gemini-4-argon-medium
                  project: aicode-consumers
                  request:
                    contents:
                      - role: user
                        parts:
                          - text: "Say OK"
              argonBareIdNotFound:
                x-provenance: live
                summary: >-
                  The 404 freeze: bare base id is not a registered
                  PredictionService entity (identical on generateContent and
                  streamGenerateContent).
                value:
                  model: gemini-4-argon
                  project: aicode-consumers
                  request:
                    contents:
                      - role: user
                        parts:
                          - text: "Say OK"
              titleCheckpointTurn:
                x-provenance: live
                value:
                  model: gemini-3.5-flash-lite
                  project: aicode-consumers
                  requestId: checkpoint/157846ba-e944-4f58-8ba1-01a56c06ff2c
                  requestType: checkpoint
                  userAgent: antigravity
                  request:
                    contents:
                      - role: user
                        parts:
                          - text: "Reply with exactly: CAPTURE-OK"
                    generationConfig:
                      thinkingConfig:
                        includeThoughts: true
                        thinkingLevel: LOW
                    sessionId: "-3750763034362895579"
                    systemInstruction:
                      role: user
                      parts:
                        - text: "You are a conversation title generator…"
      responses:
        "200":
          description: >-
            SSE stream of wrapped GenerateContentResponse frames (anatomy
            above). `Content-Type: text/event-stream`,
            `Content-Disposition: attachment`, chunked.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/StreamFrame"
              examples:
                firstFrame:
                  x-provenance: live
                  value:
                    response:
                      candidates:
                        - content:
                            role: model
                            parts:
                              - text: CAPTURE-OK
                      usageMetadata:
                        promptTokenCount: 11820
                        candidatesTokenCount: 3
                        thoughtsTokenCount: 24
                        totalTokenCount: 11847
                      modelVersion: gemini-3.8-flash-n
                      responseId: sgPPaqn5M9rXrfcP1POhMA
                    traceId: "2069e2aa710b228f"
                    metadata: {}
                terminalFrame:
                  x-provenance: live
                  value:
                    response:
                      candidates:
                        - content:
                            role: model
                            parts:
                              - thoughtSignature: EmcKZQFpFH0TVnMvhEWlHv…
                                text: ""
                          finishReason: STOP
                      usageMetadata:
                        promptTokenCount: 11820
                        candidatesTokenCount: 3
                        totalTokenCount: 11847
                      modelVersion: gemini-3.8-flash-n
                      responseId: sgPPaqn5M9rXrfcP1POhMA
                    traceId: "2069e2aa710b228f"
                    metadata: {}
        "404":
          description: >-
            Unregistered `model` id. Live 2026-10-23: envelope
            `{"error":{"code":404,"message":"Requested entity was not
            found.","status":"NOT_FOUND"}}`. `gemini-4-argon` (bare) is the
            canonical repro; per-level argon ids and the `-tiered` canonical
            rows resolve. 404 alone does not establish tier ineligibility —
            check the account surface's `disabled` row first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/ResourceExhausted"

  /v1internal:generateContent:
    post:
      operationId: generateContent
      tags: [inference]
      summary: Unary (non-streaming) twin of the SSE envelope
      x-provenance: bundle + live
      description: |
        Same envelope as `streamGenerateContent`, no `?alt=sse`, response is a
