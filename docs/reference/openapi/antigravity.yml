    `agy` 1.5.3 (Go 1.28, boringcrypto). Captured 2026-11-07 on a fresh
    connection to daily-cloudcode-pa.googleapis.com by peeking the raw
    ClientHello record (MSG_PEEK, TLS untouched) and decoding the h2 frames
    before mitmproxy terminated TLS.
