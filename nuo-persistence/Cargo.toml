[package]
name = "nuo-persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true }
nuo-wire = { workspace = true }
nuo-host = { workspace = true }
nuo-model-codec = { workspace = true }
nuo-tool = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt", "rt-multi-thread", "sync", "time"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
toml = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
directories = { workspace = true }
libc = { workspace = true }
crc32c = "0.6"
hex = "0.4"
chrono = { workspace = true }
inventory = { workspace = true }
base64 = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = { workspace = true }
nuo-host = { path = "../nuo-host", features = ["test-path-override"] }

[features]
test-path-override = ["nuo-host/test-path-override"]

[lints]
workspace = true
