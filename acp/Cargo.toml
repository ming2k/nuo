[package]
name = "acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Agent Coordination Protocol (ACP) - Canonical inter-agent communication, addressing, envelopes, and collaborative channels"
repository = "https://github.com/ming2k/nuo"
readme = "README.md"
keywords = ["agent", "protocol", "acp", "communication", "coordination"]
categories = ["asynchronous", "network-programming"]

[dependencies]
nuo-tool = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
futures = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }

