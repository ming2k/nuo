name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt · clippy · test · docs · lineage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Formatting is a hard gate: the repo has no rustfmt.toml, so the default
      # thresholds and import ordering are the contract.
      - name: rustfmt
        run: cargo fmt --all --check

      # The workspace denies unwrap/expect/panic/todo/dbg_macro for shipped code
      # (test targets opt out at the test boundary), so this must stay silent.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      # `Cargo.toml` denies broken/private intra-doc links and invalid HTML
      # (`[workspace.lints.rustdoc]`); rustdoc evaluates those lints, so this is
      # where the documentation contract is enforced. `--no-deps` scopes it to
      # this workspace.
      - name: docs
        run: cargo doc --workspace --no-deps

      # `docs/dev/standards/style.md` §1: relative links resolve and anchors match headings.
      - name: doc links
        run: cargo test -p nuo --test doc_governance -- test_doc_links --nocapture

      # docs/dev/standards/adr.md §4: every citation must resolve in-repo.
      - name: ADR lineage
        run: cargo test -p nuo --test doc_governance -- test_adr_lineage --nocapture

      # ADR-0105/ADR-0106/ADR-0109/ADR-0111: the concentric dependency direction is a
      # mechanical gate (server purity, client-server anti-inversion, zero-IO presentation
      # substrate, retired-crate prohibition, 3-tier topology).
      - name: presentation firewall
        run: cargo test -p nuo --test architecture_firewall -- test_inv_arch_firewall_and_topology --nocapture

      # ADR-0105 / [INV-ARCH-CLI-LEAN-LINK]: a lean `nuo` (without the
      # `interactive` feature) must not link a terminal raw-mode driver, the
      # pure presentation substrate, or a retired presentation crate.
      - name: lean CLI link
        run: cargo test -p nuo --test architecture_firewall -- test_inv_arch_cli_lean_link --nocapture

  release:
    name: release binary (${{ matrix.target }})
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `docs/dev/release-and-versioning.md` Playbook 2 promises a prebuilt `nuo`
      # binary per platform on every `v*` tag; this is that runner.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: nuo
          manifest-path: crates/nuo/Cargo.toml
          target: ${{ matrix.target }}
          archive: nuo-$tag-$target
          token: ${{ secrets.GITHUB_TOKEN }}
