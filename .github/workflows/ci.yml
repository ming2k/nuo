name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt · clippy · test · lineage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Formatting is a hard gate: the repo has no rustfmt.toml, so the default
      # thresholds and import ordering are the contract.
      - name: rustfmt
        run: cargo fmt --all --check

      # The workspace denies unwrap/expect/panic/todo/dbg_macro for shipped code
      # (test targets opt out at the test boundary), so this must stay silent.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      # docs/dev/standards/adr.md §4: every citation must resolve in-repo.
      - name: ADR lineage
        run: python3 scripts/check_adr_lineage.py

  release:
    name: release binary (${{ matrix.target }})
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `docs/dev/release-and-versioning.md` Playbook 2 promises a prebuilt `nuo`
      # binary per platform on every `v*` tag; this is that runner.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: nuo
          manifest-path: nuo/Cargo.toml
          target: ${{ matrix.target }}
          archive: nuo-$tag-$target
          token: ${{ secrets.GITHUB_TOKEN }}
