[package]
name = "engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

publish = false
[dependencies]
guardrails = { workspace = true }
tool = { workspace = true }
provider = { workspace = true }
model-routing = { workspace = true }
inference-wire = { workspace = true }
protocol = { workspace = true }
persistence = { workspace = true }
host = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
jiff = { workspace = true }
netune = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
fastrand = { workspace = true }
walkdir = { workspace = true }
inventory = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Capability leaves are linked by the composition root in the shipped graph;
# engine tests may construct them directly.
tool-fs = { workspace = true }
tool-exec = { workspace = true }
tool-ast = { workspace = true }
tool-web = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
# `test-path-override` exposes `paths::TestDirsGuard` through the persistence
# façade so catalog discovery tests can sandbox the XDG roots; without it a
# `DiscoveryCache::save()` in a test writes `test-instance` rows into the
# developer's real `$XDG_STATE_HOME/nuo/models_discovery.json`.
persistence = { workspace = true, features = ["test-path-override"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["inventory"]
