[package]
name = "nuo-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cognitive agent runtime, ReAct loop, session lifecycle, token compaction, and peer delegation SDK for Nuo"

[dependencies]
acp = { workspace = true }
nuo-model-codec = { workspace = true, optional = true }
nuo-tool = { workspace = true }
nuo-provider = { workspace = true }
nuo-wire = { workspace = true }
nuo-mcp = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt", "fs"] }
tokio-util = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[features]
default = ["wire", "mcp"]
wire = ["dep:nuo-model-codec"]
mcp = ["dep:nuo-mcp"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
