[package]
name = "nuo-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nuo-guardrails = { workspace = true }
nuo-tool = { workspace = true }
nuo-provider = { workspace = true }
nuo-model-routing = { workspace = true }
nuo-inference-wire = { workspace = true }
nuo-protocol = { workspace = true }
nuo-persistence = { workspace = true }
nuo-host = { workspace = true }
serde_yaml = { workspace = true }
dirs = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
netune = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
fastrand = { workspace = true }
walkdir = { workspace = true }
inventory = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Capability leaves are linked by the composition root in the shipped graph;
# engine tests may construct them directly.
nuo-tool-fs = { workspace = true }
nuo-tool-exec = { workspace = true }
nuo-tool-ast = { workspace = true }
nuo-tool-web = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
# `test-path-override` exposes `paths::TestDirsGuard` through the persistence
# façade so catalog discovery tests can sandbox the XDG roots; without it a
# `DiscoveryCache::save()` in a test writes `test-instance` rows into the
# developer's real `$XDG_STATE_HOME/nuo/models_discovery.json`.
nuo-persistence = { workspace = true, features = ["test-path-override"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["inventory"]
