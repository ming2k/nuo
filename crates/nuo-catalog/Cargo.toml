[package]
name = "nuo-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Catalog derivation pipeline: connections x presets x discovery cache -> provider entries, channels, and the picker snapshot"

[dependencies]
nuo-wire = { workspace = true }
nuo-persistence = { workspace = true }
nuo-provider = { workspace = true }
nuo-inference-wire = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
futures = { workspace = true }
sha2 = { workspace = true }
glob = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The catalog tests exercise the real registered provider table and the real
# credential-source builders, both of which the composition root owns
# (`[INV-PROV-04]`). This edge is dev-only: Cargo admits a cycle only when it
# passes through a dev-dependency, so the shipped build graph
# (`nuo-server -> nuo-catalog`) stays acyclic. `nuo-harness` declares the same
# edge for the same reason.
nuo-server = { workspace = true }
# `test-path-override` exposes `nuo_host::paths::TestDirsGuard` so the catalog
# discovery tests can sandbox the XDG roots; without it a `DiscoveryCache::save()`
# in a test writes `test-instance` rows into the developer's real
# `$XDG_STATE_HOME/nuo/models_discovery.json`.
nuo-host = { workspace = true, features = ["test-path-override"] }
mockito = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
