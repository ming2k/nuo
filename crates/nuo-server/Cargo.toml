[package]
name = "nuo-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Headless session runtime, UDS/WebSocket gateway, and multi-session host for Nuo"

[dependencies]
acp = { workspace = true }
nuo-client = { workspace = true }
nuo-wire = { workspace = true }
nuo-persistence = { workspace = true }
nuo-host = { workspace = true }
nuo-provider = { workspace = true }
nuo-model-codec = { workspace = true, features = ["netune"] }
nuo-provider-transport = { workspace = true }
nuo-oauth = { workspace = true }
nuo-provider-catalog = { workspace = true }
nuo-provider-anthropic = { workspace = true }
nuo-provider-google-antigravity = { workspace = true }
nuo-provider-openai = { workspace = true }
nuo-provider-chatgpt-plan = { workspace = true }
nuo-provider-deepseek = { workspace = true }
nuo-provider-kimi = { workspace = true }
nuo-provider-copilot = { workspace = true }
nuo-provider-commandcode-plan = { workspace = true }
nuo-provider-opencode = { workspace = true }
nuo-provider-openrouter = { workspace = true }
nuo-provider-xai = { workspace = true }
nuo-provider-qianwen = { workspace = true }
nuo-provider-zai = { workspace = true }
nuo-provider-siliconflow = { workspace = true }
nuo-provider-qoder = { workspace = true }
inventory = { workspace = true }
nuo-harness = { workspace = true }
nuo-mcp = { workspace = true }
nuo-tool = { workspace = true }
nuo-tool-fs = { workspace = true }
nuo-tool-exec = { workspace = true }
nuo-tool-web = { workspace = true }
nuo-tool-ast = { workspace = true }
netune = "0.1.0"
ignore = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
bytes = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
semver = { workspace = true }
libc = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
glob = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
nuo-host = { workspace = true, features = ["test-path-override"] }
# The `qoder_catalog_dump` example builds a `Request` by HTTP method.
http = "1.4"

[features]
collaboration = []

[lints]
workspace = true
