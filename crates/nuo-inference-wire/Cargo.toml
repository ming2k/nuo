[package]
name = "nuo-inference-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The inference wire: vendor dialect codecs, SSE stream demuxing, and transport for external model APIs (OpenAI, Anthropic, Google, DeepSeek)"

[dependencies]
netune = { workspace = true, optional = true }
netune-trace = { workspace = true, optional = true }
bytes = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
futures = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }
nuo-egress = { workspace = true }
nuo-host = { workspace = true }
nuo-tool = { workspace = true }
sha2 = { workspace = true }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }

[features]
default = ["netune"]
netune = ["dep:netune", "dep:netune-trace"]
reqwest-oracle = ["dep:reqwest"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
