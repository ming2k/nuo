[package]
name = "nuo-egress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Universal HTTP egress, connection pooling, SSE streaming reassembly, and network telemetry for Nuo"

[dependencies]
netune = { workspace = true }
netune-trace = { workspace = true }
http = "1.4"
httpdate = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
futures = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
fastrand = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
