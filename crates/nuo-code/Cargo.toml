[package]
name = "nuo-code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Code intelligence, AST structural query, and syntax validation domain powered by Tree-sitter for Nuo"

[dependencies]
async-trait = { workspace = true }
glob = { workspace = true }
ignore = { workspace = true }
inventory = { workspace = true }
nuo-wire = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt", "fs"] }
toml = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
fastrand = { workspace = true }
sha2 = { workspace = true }

tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-go = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }

[lints]
workspace = true
