[package]
name = "nuo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "nuo"
path = "src/main.rs"

[lib]
name = "nuo"
path = "src/lib.rs"

[dependencies]
acp = { workspace = true }
nuo-client = { workspace = true }
nuo-contracts = { workspace = true }
nuo-persistence = { workspace = true }
nuo-host = { workspace = true }
nuo-providers = { workspace = true }
nuo-harness = { workspace = true }
netune = "0.1.0"
ignore = { workspace = true }
nuo-mcp = { workspace = true }
nuo-tool = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
bytes = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
semver = { workspace = true }
libc = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
glob = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
nuo-host = { workspace = true, features = ["test-path-override"] }

[lints]
workspace = true
