[workspace]
members = [
    "nuo",
    "crates/*",
    "tools/*",
    "providers/*",
]
default-members = ["nuo"]
resolver = "2"

[workspace.package]
version = "0.0.46"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "yaml_serde", version = "0.10" }
semver = "1.0"
toml = "1"
futures = "0.3"
async-trait = "0.1"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
libc = "0.2"
glob = "0.3"
ignore = "0.4"
walkdir = "2"
dirs = "6"
directories = "6.0"
arboard = "3.6"
uuid = { version = "1", features = ["v4", "serde"] }
httpdate = "1"
fastrand = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
md-5 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
cbc = { version = "0.1", features = ["alloc"] }
aes = "0.8"
tracing = "0.1"
inventory = "0.3"
syn = { version = "2", features = ["full", "derive"] }
quote = "1"
proc-macro2 = "1"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
thiserror = "2.0"
# netune is distributed by git tag only: the crates.io `0.1.x` line is yanked
# and unmaintained, and the registry `0.0.1` is a stale stub. Pin the release
# tag here; `Cargo.lock` records the exact commit for reproducible builds.
# v0.0.3 makes pooled connections runtime-affine: a keep-alive socket dialled by
# one tokio runtime is discarded rather than handed to another, which is how a
# process-global `shared_client()` pool could surface
# `RUNTIME_SHUTTING_DOWN_ERROR` as a provider transport failure.
netune = { git = "https://github.com/ming2k/netune.git", tag = "v0.0.3" }
netune-trace = { git = "https://github.com/ming2k/netune.git", tag = "v0.0.3" }
http = "1.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
windows-sys = "0.61"
notify = "8"
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"

# TUI stack
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
unicode-segmentation = "1.12"
similar = { version = "2", features = ["unicode"] }
bitflags = "2"

# Diagnostics & testing
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
insta = "1.48"
mockito = "1"
tempfile = "3"

# ACP & Substrates
nuo-acp = { version = "0.0.46", path = "crates/nuo-acp" }
acp = { version = "0.0.46", package = "nuo-acp", path = "crates/nuo-acp" }
nuo-agent = { version = "0.0.46", path = "crates/nuo-agent" }
nuo-tool = { version = "0.0.46", path = "crates/nuo-tool" }
nuo-tool-derive = { version = "0.0.46", path = "crates/nuo-tool-derive" }
nuo-provider = { version = "0.0.46", path = "crates/nuo-provider" }
nuo-oauth = { version = "0.0.46", path = "crates/nuo-oauth" }
nuo-egress = { version = "0.0.46", path = "crates/nuo-egress" }
nuo-provider-qoder = { version = "0.0.46", path = "providers/nuo-provider-qoder" }
nuo-provider-catalog = { version = "0.0.46", path = "providers/nuo-provider-catalog" }
nuo-provider-anthropic = { version = "0.0.46", path = "providers/nuo-provider-anthropic" }
nuo-provider-google-antigravity = { version = "0.0.46", path = "providers/nuo-provider-google-antigravity" }
nuo-provider-openai = { version = "0.0.46", path = "providers/nuo-provider-openai" }
nuo-provider-chatgpt-plan = { version = "0.0.46", path = "providers/nuo-provider-chatgpt-plan" }
nuo-provider-deepseek = { version = "0.0.46", path = "providers/nuo-provider-deepseek" }
nuo-provider-kimi = { version = "0.0.46", path = "providers/nuo-provider-kimi" }
nuo-provider-copilot = { version = "0.0.46", path = "providers/nuo-provider-copilot" }
nuo-provider-commandcode-plan = { version = "0.0.46", path = "providers/nuo-provider-commandcode-plan" }
nuo-provider-opencode-plan = { version = "0.0.46", path = "providers/nuo-provider-opencode-plan" }
nuo-provider-opencode-zen = { version = "0.0.46", path = "providers/nuo-provider-opencode-zen" }
nuo-provider-openrouter = { version = "0.0.46", path = "providers/nuo-provider-openrouter" }
nuo-provider-xai = { version = "0.0.46", path = "providers/nuo-provider-xai" }
nuo-provider-qianwen = { version = "0.0.46", path = "providers/nuo-provider-qianwen" }
nuo-provider-zai = { version = "0.0.46", path = "providers/nuo-provider-zai" }
nuo-provider-siliconflow = { version = "0.0.46", path = "providers/nuo-provider-siliconflow" }
nuo-mcp = { version = "0.0.46", path = "crates/nuo-mcp" }
nuo-inference-wire = { version = "0.0.46", path = "crates/nuo-inference-wire", default-features = false }

# Terminal Substrate (Nuotc)
nuotc = "0.0.3"

# In-house Nuo crates
nuo-protocol = { version = "0.0.46", path = "crates/nuo-protocol" }
nuo-wire = { version = "0.0.46", package = "nuo-protocol", path = "crates/nuo-protocol" }
nuo = { version = "0.0.46", path = "nuo" }
nuo-server = { version = "0.0.46", path = "crates/nuo-server" }
nuo-tui = { version = "0.0.46", path = "crates/nuo-tui" }
nuox = { package = "nuo-tui", version = "0.0.46", path = "crates/nuo-tui" }
nuo-persistence = { version = "0.0.46", path = "crates/nuo-persistence" }
nuo-host = { version = "0.0.46", path = "crates/nuo-host" }
nuo-harness = { version = "0.0.46", path = "crates/nuo-harness" }
nuo-catalog = { version = "0.0.46", path = "crates/nuo-catalog" }
nuo-tool-fs = { version = "0.0.46", path = "tools/nuo-tool-fs" }
nuo-tool-exec = { version = "0.0.46", path = "tools/nuo-tool-exec" }
nuo-tool-web = { version = "0.0.46", path = "tools/nuo-tool-web" }
nuo-tool-ast = { version = "0.0.46", path = "tools/nuo-tool-ast" }

[workspace.lints.rust]
unsafe_code = "allow"

[workspace.lints.clippy]
# Shipped code must not abort the process or silently short-circuit: fallible
# work returns an error, and startup paths surface a typed failure. Unit-test and
# integration-test targets opt out explicitly (`cfg_attr(test, allow(..))` at the
# crate root / `#![allow(..)]` in test targets) because there a panic *is* the
# report. Denied rather than warned so the exemption cannot rot silently.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "allow"
print_stderr = "allow"
