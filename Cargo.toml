# Repository test host. This is intentionally **not** a production crate: it
# owns the root `tests/` entry points so integration and E2E suites compile as
# one binary each instead of one linker invocation per test file (ADR-0178).
# Production code remains in the multi-crate `crates/*` workspace.
[package]
name = "nuo-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false
autobenches = false

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[workspace]
members = [
    "crates/*",
]
default-members = ["crates/nuo"]
resolver = "2"

[workspace.package]
version = "0.0.100"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "yaml_serde", version = "0.10" }
semver = "1.0"
toml = "1"
regex = "1.11"
futures = "0.3"
async-trait = "0.1"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
libc = "0.2"
glob = "0.3"
ignore = "0.4"
walkdir = "2"
dirs = "6"
directories = "6.0"
# Text clipboard only: the TUI never calls `get_image`/`set_image`, so arboard's
# default `image-data` feature would drag platform image/codec dependencies in
# for no capability we use.
arboard = { version = "3.6", default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
httpdate = "1"
fastrand = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
md-5 = "0.10"
rsa = { version = "0.10", features = ["pkcs1v15"] }
getrandom = "0.4"
cbc = { version = "0.1", features = ["alloc"] }
aes = "0.8"
tracing = "0.1"
inventory = "0.3"
syn = { version = "2", features = ["full", "derive"] }
quote = "1"
proc-macro2 = "1"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
thiserror = "2.0"
# netune is distributed by git tag only: the crates.io publication of the
# `0.1.x` line is yanked and unmaintained, and the registry `0.0.1` is a stale
# stub. Pin the release tag here; `Cargo.lock` records the exact commit for
# reproducible builds.
# v0.0.10 replaces the shared `Arc<Mutex<Recorder>>` with tiered observation: a
# per-attempt `Observation` selects `NoTap`/`Counters`/`Ring`, `TraceCollector`
# is the only cold-path handle, and a response body reports the fidelity its tap
# actually produced. It also adds typed connection identities and profile
# registries, controlled dynamic QPACK, and HTTP/3 ingress. Nuo keeps the
# L1 `Traced` policy for model attempts because its latency telemetry is derived
# from the protocol timeline; control-plane calls keep a small traced ring only
# to name the phase a timeout interrupted.
# v0.0.29 replaces `TlsConnector` with `TlsRouterConnector` over the owned
# `netune-tls` egress engine, splits `antigravity-cli` into
# `antigravity-cli-unary` (`http/1.1` only) and `antigravity-cli-stream`
# (`h2, http/1.1` paired with `go-nethttp`), and adds per-connection HTTP/2
# regular-header order policy (`GoMapRandom` for `H2Fingerprint::go`).
# v0.1.1 is the GA release of the Stable tier: the public configuration and
# trace types are `#[non_exhaustive]` with `with_*` builders, plain TLS uses
# rustls by default, and the owned `netune-tls` engine is opt-in through a
# named profile.
# v0.1.2 adds the decrypted Antigravity 1.5.12 HTTP/1.1 wire profile,
# `ClientConfig::accept_encoding_gzip`, default-port stripping for `Host` /
# `:authority`, typed `NetError::is_unreachable()`, explicit `Client::clear_pool()`,
# `ws://`/`wss://` URL parsing, `Client::connect_ws_with`, and cancel-safe
# multi-cycle `WsSession` heartbeat liveness (ADR-0224).
netune = { git = "https://github.com/ming2k/netune.git", tag = "v0.1.2" }
netune-trace = { git = "https://github.com/ming2k/netune.git", tag = "v0.1.2" }
http = "1.2"
# Image normalization accepts only JPEG and PNG (see `host/src/image.rs`);
# GIF/WebP are deliberately left untouched, so their decoders must not be built.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# PDF text extraction is a host capability behind the `DocumentExtractor` seam
# (ADR-0193). The filesystem tool crate never links this parser; only the
# composition root injects the host implementation.
pdf-extract = "0.12"
windows-sys = "0.61"
notify = "8"
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"

# TUI stack
unicode-width = "0.2"
unicode-segmentation = "1.12"
similar = { version = "2", features = ["unicode"] }

# Diagnostics & testing
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
insta = "1.48"
mockito = "1"
tempfile = "3"

# ACP & Substrates
acp = { version = "0.0.100", path = "crates/acp" }
tool = { version = "0.0.100", path = "crates/tool" }
tool-derive = { version = "0.0.100", path = "crates/tool-derive" }
provider = { version = "0.0.100", path = "crates/provider" }
provider-qoder = { version = "0.0.100", path = "crates/provider-qoder" }
provider-catalog = { version = "0.0.100", path = "crates/provider-catalog" }
provider-anthropic = { version = "0.0.100", path = "crates/provider-anthropic" }
provider-google-antigravity = { version = "0.0.100", path = "crates/provider-google-antigravity" }
provider-openai = { version = "0.0.100", path = "crates/provider-openai" }
provider-chatgpt-plan = { version = "0.0.100", path = "crates/provider-chatgpt-plan" }
provider-deepseek = { version = "0.0.100", path = "crates/provider-deepseek" }
provider-kimi = { version = "0.0.100", path = "crates/provider-kimi" }
provider-copilot = { version = "0.0.100", path = "crates/provider-copilot" }
provider-commandcode-goat = { version = "0.0.100", path = "crates/provider-commandcode-goat" }
provider-opencode-go = { version = "0.0.100", path = "crates/provider-opencode-go" }
provider-opencode-zen = { version = "0.0.100", path = "crates/provider-opencode-zen" }
provider-opendesign-go = { version = "0.0.100", path = "crates/provider-opendesign-go" }
provider-openrouter = { version = "0.0.100", path = "crates/provider-openrouter" }
provider-xai = { version = "0.0.100", path = "crates/provider-xai" }
provider-qianwen = { version = "0.0.100", path = "crates/provider-qianwen" }
provider-glm-cn = { version = "0.0.100", path = "crates/provider-glm-cn" }
provider-codebuddy = { version = "0.0.100", path = "crates/provider-codebuddy" }
inference-wire = { version = "0.0.100", path = "crates/inference-wire", default-features = false }
# Dev-only: hermetic E2E harness (sandboxed NUO_HOME, mock provider, CLI
# runner). Never a shipped dependency; `tests/integration/governance/test_architecture.rs`
# enforces that it stays under `[dev-dependencies]`.
test-support = { version = "0.0.100", path = "crates/test-support" }

# Terminal Substrate (Graticule)
graticule = "0.0.2"
graticule-canvas = "0.0.2"

# In-house Nuo crates
protocol = { version = "0.0.100", path = "crates/protocol" }
nuo = { version = "0.0.100", path = "crates/nuo" }
server = { version = "0.0.100", path = "crates/server" }
persistence = { version = "0.0.100", path = "crates/persistence" }
ui-primitives = { version = "0.0.100", path = "crates/ui-primitives" }
view = { version = "0.0.100", path = "crates/view" }
host = { version = "0.0.100", path = "crates/host" }
engine = { version = "0.0.100", path = "crates/engine" }
guardrails = { version = "0.0.100", path = "crates/guardrails" }
model-routing = { version = "0.0.100", path = "crates/model-routing" }
tool-fs = { version = "0.0.100", path = "crates/tool-fs" }
tool-exec = { version = "0.0.100", path = "crates/tool-exec" }
tool-web = { version = "0.0.100", path = "crates/tool-web" }
tool-ast = { version = "0.0.100", path = "crates/tool-ast" }

# The root test host links every crate whose public surface the integration
# and E2E suites exercise. All edges are dev-only; `nuo-tests` is not shipped.
[dev-dependencies]
nuo = { workspace = true }
acp = { workspace = true }
engine = { workspace = true }
host = { workspace = true }
inference-wire = { workspace = true }
model-routing = { workspace = true }
persistence = { workspace = true, features = ["test-path-override"] }
protocol = { workspace = true }
provider = { workspace = true }
provider-anthropic = { workspace = true }
provider-catalog = { workspace = true }
provider-chatgpt-plan = { workspace = true }
provider-google-antigravity = { workspace = true }
provider-openai = { workspace = true }
provider-qoder = { workspace = true }
server = { workspace = true }
test-support = { workspace = true }
tool = { workspace = true }
tool-exec = { workspace = true }
tool-fs = { workspace = true }
tool-ast = { workspace = true }
tool-web = { workspace = true }
guardrails = { workspace = true }
view = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
insta = { workspace = true }
libc = { workspace = true }
mockito = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true, features = ["visit"] }
tempfile = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-util = { workspace = true }
tokio-tungstenite = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "allow"

[workspace.lints.clippy]
# Shipped code must not abort the process or silently short-circuit: fallible
# work returns an error, and startup paths surface a typed failure. Unit-test and
# integration-test targets opt out explicitly (`cfg_attr(test, allow(..))` at the
# crate root / `#![allow(..)]` in test targets) because there a panic *is* the
# report. Denied rather than warned so the exemption cannot rot silently.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "allow"
print_stderr = "allow"

# rustdoc is a hard gate alongside clippy: a citation that does not resolve, a
# public doc that reaches a private item, or a stray HTML tag fails `cargo doc`
# (CI `docs` step). The workspace cites hundreds of items and ~100 ADRs, so this
# drift has to be caught mechanically rather than by review.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"

[profile.dev]
# 1 = line-tables-only: retains source file and line information in panic backtraces
# without inflating DWARF tables with variable and type scopes.
debug = 1
split-debuginfo = "unpacked"

# Optimize external dependencies for responsive tests, but not at `opt-level = 2`
# across the whole graph: that multiplies cold-build time for ~300 crates and,
# measured on this workspace, only shaves a few percent off test execution.
# `1` keeps the hot paths (serde, tokio, image, rustls) reasonable while cutting
# total dependency codegen materially. See the `libsqlite3-sys` override below.
[profile.dev.package."*"]
opt-level = 1
debug = false

# SQLite's bundled amalgamation is a single multi-megabyte C translation unit on
# the critical build path. `1` halves its compile time versus `2` without the
# severe query slowdown of `0`; see ADR-0003's local build guidance.
[profile.dev.package.libsqlite3-sys]
opt-level = 1

[profile.test]
debug = 1
split-debuginfo = "unpacked"

[profile.test.package."*"]
opt-level = 1
debug = false

[profile.test.package.libsqlite3-sys]
opt-level = 1

# Release artifacts are shipped and compressed for download. Thin LTO plus one
# codegen unit is a deliberate size/quality tradeoff: it costs ~30s of cold
# release build time here, but removes cross-crate duplication and drops the
# stripped binary by a further ~15%. `panic = "abort"` is intentionally absent:
# the persistence actor and task supervisor rely on `catch_unwind`.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

