[package]
name = "nuo-provider-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared HTTP egress, SSE streaming demuxing, request pipeline, and endpoint/client-identity substrate for Nuo providers"

[dependencies]
nuo-host = { workspace = true }
nuo-provider = { workspace = true }
nuo-model-codec = { workspace = true, features = ["netune"] }
netune = "0.1.0"
netune-trace = "0.1.0"
http = "1.4"
httpdate = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
futures = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
fastrand = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
